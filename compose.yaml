services:
  bnbu:
    build: .
    init: true
    ports:
      - "127.0.0.1:4174:4174"
    environment:
      BNBU_DATABASE: /app/data/bnbu.sqlite
    volumes:
      - bnbu-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4175/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  bnbu-data:
