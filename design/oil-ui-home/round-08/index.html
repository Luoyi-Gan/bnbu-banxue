<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>会同里 · 图片展示效果</title><style>
@font-face{font-family:MiSans;src:url('/fonts/misans/MiSans-Regular.woff2')}*{box-sizing:border-box}body{margin:0;background:#f5f4ef;color:#263b40;font-family:MiSans,'Microsoft YaHei',sans-serif}header{padding:26px 32px 20px;border-bottom:1px solid #dbe0d6}h1{font-size:27px;font-weight:500;margin:0 0 10px}p{line-height:1.7;margin:0;color:#56695e}main{display:grid;grid-template-columns:205px minmax(0,1fr);gap:28px;padding:26px 32px}nav{display:flex;flex-direction:column;gap:7px}button,a{font:inherit}button{cursor:pointer;color:inherit;min-height:44px;background:#fffefa;border:1px solid #dbe0d6;border-radius:5px;padding:10px 14px;text-align:left}button[aria-pressed=true]{background:#e0e9e3;border-color:#8da99d}nav button strong,nav button small{display:block}nav small{margin-top:4px;color:#65726a}section{min-width:0}.tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:18px}.tools a{margin-left:auto;color:#345f72;min-height:44px;padding:10px 0}.tools label{display:flex;align-items:center;gap:8px;min-height:44px;padding:8px}input{width:18px;height:18px}h2{font-size:22px;font-weight:500;margin:0 0 16px}.screens{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:22px;align-items:start}.screens.single{grid-template-columns:minmax(0,1fr)}figure{margin:0;min-width:0}figcaption{margin-bottom:10px;color:#52675f}.viewport{max-height:calc(100vh - 245px);min-height:350px;overflow:auto;border:1px solid #dbe0d6;background:#fff}.viewport img{display:block;width:100%;height:auto}.mobile .viewport{max-width:393px;margin:auto}.desktop .viewport{max-width:1440px}footer{padding:12px 0;line-height:1.7;color:#65726a;font-size:13px}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #426575;outline-offset:3px}@media(max-width:900px){main{grid-template-columns:1fr;padding:18px;gap:20px}header{padding:22px 18px}nav{flex-direction:row;overflow:auto;padding-bottom:8px}nav button{flex:0 0 130px}.screens{grid-template-columns:1fr}.viewport{max-height:75vh}.tools a{margin-left:0}h1{font-size:23px}}
</style><header><h1>同一座校园，不同的画幅</h1><p>15 个代表页面 · 保留现有照片 · 左右对照改前与现在</p></header><main><nav aria-label="选择页面"></nav><section><div class="tools"><button id="mobile" aria-pressed="true">手机</button><button id="desktop" aria-pressed="false">桌面</button><label><input id="compare" type="checkbox" checked>显示改前对照</label><a id="live" target="_blank" rel="noopener">打开实际页面 ↗</a></div><h2></h2><div class="screens mobile"><figure id="old"><figcaption>改前</figcaption><div class="viewport"><a target="_blank"><img alt=""></a></div></figure><figure><figcaption>现在</figcaption><div class="viewport"><a target="_blank"><img id="current" alt=""></a></div></figure></div><footer>图片区域可滚动查看整页，点击图片可打开原图。教师页面需对应的本地身份；截图使用本地模拟数据。</footer></section></main><script>const items=[{"id": "home", "role": "student", "url": "/v2", "family": "campus", "label": "首页", "treatment": "留白相框"}, {"id": "discover", "role": "student", "url": "/v2/activities", "family": "campus", "label": "发现", "treatment": "横幅海报"}, {"id": "campus", "role": "student", "url": "/v2/campus", "family": "campus", "label": "校园", "treatment": "全景与标题签"}, {"id": "me", "role": "student", "url": "/v2/me", "family": "campus", "label": "我的", "treatment": "个人照片册"}, {"id": "schedule", "role": "student", "url": "/v2/schedule", "family": "directory", "label": "日程", "treatment": "书签推荐"}, {"id": "activity", "role": "student", "url": "/v2/activities/preview-event-2", "family": "detail", "label": "活动详情", "treatment": "原图底托"}, {"id": "manage-activities", "role": "student", "url": "/v2/activities?view=manage", "family": "directory", "label": "活动浏览", "treatment": "海报封面"}, {"id": "organizations", "role": "student", "url": "/v2/organizations", "family": "directory", "label": "组织", "treatment": "图片与内容层级"}, {"id": "community", "role": "student", "url": "/v2/community", "family": "directory", "label": "社区", "treatment": "编辑式照片"}, {"id": "coffee", "role": "student", "url": "/v2/coffee", "family": "directory", "label": "Coffee Chat", "treatment": "紧凑场景缩略图"}, {"id": "alumni", "role": "student", "url": "/v2/alumni", "family": "directory", "label": "校友", "treatment": "白边照片册"}, {"id": "teacher-coffee", "role": "teacher", "url": "/v2/teacher/coffee", "family": "staff", "label": "教师端", "treatment": "侧栏照片条"}, {"id": "admin-overview", "role": "admin", "url": "/v2/admin", "family": "staff", "label": "管理员端", "treatment": "紧凑全景条"}, {"id": "login", "role": "public", "url": "/v2/login", "family": "entry", "label": "登录", "treatment": "方形照片板"}, {"id": "welcome", "role": "public", "url": "/v2/welcome", "family": "entry", "label": "欢迎", "treatment": "全幅留边"}];let selected=0,device='mobile';const $=s=>document.querySelector(s);const nav=$('nav');items.forEach((e,i)=>{const b=document.createElement('button');b.innerHTML='<strong>'+e.label+'</strong><small>'+e.treatment+'</small>';b.onclick=()=>{selected=i;render()};nav.append(b)});function render(){const e=items[selected];$('h2').textContent=e.label+' · '+e.treatment;nav.querySelectorAll('button').forEach((b,i)=>b.setAttribute('aria-pressed',i===selected));$('#live').href=(e.role==='teacher'?'http://localhost:4174':'http://127.0.0.1:4174')+e.url;document.querySelectorAll('figure').forEach((f,i)=>{const src=(i===0?'before-':'')+e.id+'-'+device+'.png';f.querySelector('img').src=src;f.querySelector('img').alt=e.label+(i===0?'改前':'现在')+'，'+device;f.querySelector('a').href=src;f.querySelector('.viewport').scrollTop=0});$('.screens').className='screens '+device+($('#compare').checked?'':' single');$('#old').hidden=!$('#compare').checked;$('#mobile').setAttribute('aria-pressed',device==='mobile');$('#desktop').setAttribute('aria-pressed',device==='desktop')}$('#compare').onchange=render;$('#mobile').onclick=()=>{device='mobile';render()};$('#desktop').onclick=()=>{device='desktop';render()};render();</script></html>
