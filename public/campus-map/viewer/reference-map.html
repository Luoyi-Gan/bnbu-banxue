<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BNBU 完整地图资源</title><link rel="stylesheet" href="/campus-map/viewer/vendor/maplibre-gl.css"><link rel="stylesheet" href="/campus-map/viewer/reference-map.css"></head>
