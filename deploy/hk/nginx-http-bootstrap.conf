# Use only before issuing the first certificate.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.verityai.cn 43.129.193.7;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    include /etc/nginx/snippets/bnbu-campus-hub-static.conf;
}
