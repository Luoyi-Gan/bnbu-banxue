name: bnbu-postgres-local
services:
  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: bnbu
      POSTGRES_USER: bnbu
      POSTGRES_PASSWORD: ${BNBU_POSTGRES_PASSWORD:?Set BNBU_POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bnbu -d bnbu"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    init: true
    command: ["node", "backend/dist/postgres.mjs"]
    environment:
      DATABASE_URL: postgresql://bnbu:${BNBU_POSTGRES_PASSWORD:?Set BNBU_POSTGRES_PASSWORD}@postgres:5432/bnbu
      BNBU_API_HOST: 0.0.0.0
      BNBU_API_PORT: 4175
      BNBU_ALLOWED_ORIGINS: http://127.0.0.1:4188,http://localhost:4188
      BNBU_LOCAL_OUTBOX: "1"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4175/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 10
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:4188:8080"
    depends_on:
      api:
        condition: service_healthy
volumes:
  postgres-data:
