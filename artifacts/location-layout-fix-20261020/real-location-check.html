<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>真实定位检查</title><style>body{font:16px/1.8 sans-serif;max-width:600px;margin:40px auto;padding:20px}button{padding:12px 20px}p{white-space:pre-wrap}</style><h1>真实定位检查</h1><p>此页只调用浏览器真实定位服务，不显示或保存经纬度。</p><button id="locate">获取真实位置</button><p id="result" role="status">尚未请求</p><script type="module">import {bindCampusLocation} from '/scripts/campus-map-location.mjs';const button=document.querySelector('button'),output=document.querySelector('#result');const names={idle:'已清除',locating:'正在快速获取位置',refining:'快速定位未达到要求，正在尝试高精度定位',located:'浏览器已返回真实位置',denied:'位置权限被拒绝',unavailable:'位置提供方不可用',timeout:'快速与高精度定位均超时',imprecise:'位置误差超过一公里',unsupported:'浏览器不支持',insecure:'非安全环境'};bindCampusLocation({button,geolocation:navigator.geolocation,secure:isSecureContext,lifecycle:window,onPosition:()=>true,onClear:()=>{},onState:value=>{output.textContent=names[value.state]+(value.accuracy===undefined?'':'；精度约 '+value.accuracy+' 米');button.textContent=['locating','refining'].includes(value.state)?'取消定位':value.state==='located'?'清除位置':'获取真实位置'}});navigator.permissions?.query({name:'geolocation'}).then(p=>{const text=document.createElement('p');text.textContent='浏览器位置权限：'+p.state;document.body.append(text);p.onchange=()=>{text.textContent='浏览器位置权限：'+p.state}}).catch(()=>{});</script></html>
