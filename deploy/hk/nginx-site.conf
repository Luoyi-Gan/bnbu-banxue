server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name www.verityai.cn 43.129.193.7;
    server_tokens off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/letsencrypt;
        default_type text/plain;
        try_files $uri =404;
    }

    location / {
        return 301 https://www.verityai.cn$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.verityai.cn;

    ssl_certificate /etc/letsencrypt/live/www.verityai.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/www.verityai.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:CampusHubTLS:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    include /etc/nginx/snippets/bnbu-campus-hub-static.conf;
}
