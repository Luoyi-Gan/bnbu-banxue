# Static build only. This demo has no backend service.
root /var/www/bnbu-campus-hub/current;
index index.html;
charset utf-8;
server_tokens off;

access_log /var/log/nginx/bnbu-campus-hub.access.log;
error_log /var/log/nginx/bnbu-campus-hub.error.log;

add_header X-Content-Type-Options nosniff always;
add_header Referrer-Policy strict-origin-when-cross-origin always;

gzip on;
gzip_vary on;
gzip_min_length 1024;
gzip_types text/css application/javascript application/json image/svg+xml;

location = /index.html {
    expires -1;
}

location /assets/ {
    try_files $uri =404;
    expires 1y;
}

location /api/ {
    return 404;
}

location ~ /\. {
    deny all;
}

location / {
    try_files $uri $uri/ /index.html;
}
